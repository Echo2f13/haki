name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in haki lib/*.sh modules/*/module.sh modules/*/files/*; do bash -n "$f" || exit 1; done
      - name: ShellCheck
        run: |
          shellcheck -S warning -x haki lib/common.sh modules/*/module.sh modules/*/files/*
